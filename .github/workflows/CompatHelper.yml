name: CompatHelper
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - name: Install Julia
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.13'
          arch: ${{ runner.arch }}
      - name: "Add the General registry via Git"
        run: |
          import Pkg
          ENV["JULIA_PKG_SERVER"] = ""
          Pkg.Registry.add("General")
        shell: julia --color=yes {0}
      - name: "Install CompatHelper"
        run: |
          import Pkg
          name = "CompatHelper"
          uuid = "aa819f21-2bde-4658-8897-bab36330d9b7"
          version = "3"
          Pkg.add(; name, uuid, version)
        shell: julia --color=yes {0}
      - name: "Run CompatHelper"
        run: |
          import CompatHelper
          CompatHelper.main()
        shell: julia --color=yes {0}
        # The job token, scoped by `permissions:` above -- no PAT and no deploy key (#389). The
        # repository defines no Actions secrets; this step used to read two that did not exist,
        # and CompatHelper died with a 401 every night while nobody watched `[compat]`.
        #
        # The trade: GitHub does not run workflows for a PR opened with the job token, so a
        # CompatHelper PR arrives WITHOUT CI. Close and reopen it to run CI. Its PRs are signals
        # anyway: `HTTP` and `Reseau` are `~`-pinned and moved by hand (CONTRIBUTING.md), never
        # by merging a CompatHelper PR.
        #
        # REQUIRES the repository setting "Allow GitHub Actions to create and approve pull
        # requests" (Settings -> Actions -> General). With it off, GitHub refuses a PR opened with
        # the job token whatever `permissions:` grants, and the nightly 401 becomes a 403.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

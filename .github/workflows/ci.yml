name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: '*'
# Least privilege by default. Only the `docs` job writes anything, and it neither clones
# nor executes PormG. Every job that DOES build and execute the pinned PormG source runs with
# `contents: read`, `persist-credentials: false`, and no token in its environment.
#
# All three are needed, and none substitutes for the others:
#   * `permissions` decides what a leaked token can DO.
#   * `persist-credentials: false` decides whether it is on DISK for foreign code to read
#     (checkout writes it into `.git/config` by default).
#   * dropping the workflow-level `env` keeps it out of the environment of steps that
#     do not inject their own -- note `julia-actions/julia-buildpkg` DOES inject
#     `GITHUB_TOKEN: ${{ github.token }}` on its own build step, which is precisely why
#     the first two matter more than the third.
# See the `docs` job for where the write scope and the secrets actually live.
permissions:
  contents: read
# There is ONE PormG pin now, and it lives in `Project.toml`:
#
#     [sources]
#     PormG = {url = "https://github.com/PingoLee/PormG.jl.git", rev = "<sha>"}
#
# `PORMG_REV` and the two sibling-checkout steps that consumed it are gone. They existed only
# because a `[sources]` PATH dep gives Pkg nothing to pin against (#21), so the immutable rev had
# to be enforced here, out of band, by a hand-rolled clone -- and the two pins then had to be
# moved together or CI tested a configuration nobody ships. A `url` + `rev` source gives Pkg the
# pin directly: it fetches that exact commit itself, records its tree hash in the manifest, and
# every job that instantiates the project gets the same code with no workflow step at all.
#
# BUMPING IT: run `PormG.upgrade_guide(from = v"<lower bound of [compat]>")` from PormG's own env
# first and apply every entry. If that entry reads `^0.6`, the argument is `v"0.6.0"` -- the range
# is not itself a version literal. `[compat]` and `[sources]` still move together, but they are
# now both in one file.
#
# Use a full 40-character SHA, never a tag: a tag is mutable and can be re-pointed, which is
# precisely the immutability this pin exists to provide.
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    # This job builds and executes the pinned PormG source. No write scope, no token.
    permissions:
      contents: read
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    # Informational versions: these break for reasons that are not ours, and a permanently
    # red required check trains you to stop reading CI. Keep them out of the required set.
    #
    #   nightly      — compiler and Base churn two releases out. Permanently advisory.
    #                  Currently PARKED (commented out in the matrix below) -- see there.
    #
    # `~1.13.0-0` used to be listed here too, because no release of ReTestItems (the suite's
    # runner until #754) could run on 1.13 and the job died before the first assertion. It
    # executes the whole suite now, so that entry is back in the required set and is BLOCKING
    # like the rest.
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        # Julia 1.13 only, on the OS x thread-count grid: the maintainer's decision on
        # #526. It is the floor `[compat]` declares (`julia = "^1.13"`), so the declared
        # floor and the tested version are the same series. A leg for a version nothing ships
        # would be the configuration-nobody-runs CI the PormG pin rules warn about. 1.12 used to
        # hold this grid while 1.13 ran on one ubuntu leg, on the reasoning that version-specific
        # breakage is not OS-specific; #301's Windows-only crash says it can be, so the one
        # supported version gets every leg that earns its place.
        #
        # macOS is PARKED (commented out in `os` below), like `nightly`, for the pre-release
        # phase. Over the 40 CI runs before it was parked, the two macOS legs failed only when
        # ubuntu and Windows failed on the same commit -- not one macOS-only red -- and were the
        # only legs GitHub cancelled before their first step (runner capacity: 6 of those 40
        # runs), each one a re-run by hand. They are not the wall-clock long pole either; the
        # Windows legs are. Parking them removes the cancellations and nothing else.
        #
        # What parking loses: the one area where macOS differs from Linux in a way the suite
        # exercises is signal handling and task parking -- the SIGTERM `atexit` path in
        # `src/core/lifecycle.jl` (#677/#688) and the consumer e2e's SIGINFO stack dump
        # (#682). A green grid says nothing about macOS there until the legs come back.
        # RESTORE the `macos-latest` entry when the pre-release phase ends, or before merging a
        # change to `src/core/transport.jl`, `src/core/lifecycle.jl` or the Workers signal
        # handling, whichever comes first. (The parked `nightly` entry below is version
        # churn, a different reason; it comes back with the `~1.14.0-0` bump.)
        #
        # `~1.13.0-0` rather than `'1.13'` because plain semver ranges exclude
        # pre-releases; the `-0` lower bound opts them in. It resolves to >=1.13.0-0 and
        # <1.14.0, so it tracks the newest 1.13.x patch with no edit.
        #
        # MAINTENANCE: when 1.14 enters pre-release, add `~1.14.0-0` as a one-leg `include`
        # (the shape the 1.13 entry had before this), and restore the `nightly` entry below.
        # There is no self-maintaining "next release" spec (julia-actions/setup-julia#84
        # proposes one).
        version:
          - '~1.13.0-0'
        os:
          - ubuntu-latest
          # - macos-latest   # PARKED -- see the comment above
          - windows-latest
        threads: [1, 2]
        # No `include:` for now: the 1.13 entry that used to sit here as one ubuntu leg moved
        # into `version` above, and the `nightly` entry is parked. Restore the key together
        # with the first entry that comes back: a YAML `include:` with no items reads as
        # `null`, which the workflow parser refuses.
          #
          # The 1.13 entry had replaced a `version: '1'` (latest stable) entry, which sounded like
          # it covered the release above the floor but did not: `'1'` resolves to whatever is
          # *released*, which was still 1.12.x while 1.13 sat in rc, so it duplicated the
          # floor jobs while 1.13 went untested. Keep that in mind for the `~1.14.0-0` entry.
          #
          # Nitro is unusually exposed to compiler and Base churn: it redefines
          # `Base.getproperty(::HTTP.Request, ::Symbol)` at runtime, pirates
          # `HTTP.queryparams`, reads the `HTTP.BytesBody.data` internal, and treats type
          # inference as an API property -- `test/handler_tests.jl` asserts an exact
          # `Base.infer_return_type`. Nightly is how that surfaces before a stable release,
          # not after.
          #
          # PARKED: 1.13 has just shipped, so nightly is 1.14-DEV -- a full cycle before any
          # 1.14 pre-release. Until #754 the job could not even collect the suite there (#112,
          # ReTestItems' `@testsetup` parse); Nitro's own runner does, and the suite then shows
          # the known 1.14 reds (#459), which would paint every PR red. Restore it together
          # with the `~1.14.0-0` bump above. `continue-on-error` stays keyed on it.
          # - version: 'nightly'
          #   os: ubuntu-latest
          #   threads: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job EXECUTES the pinned PormG source. checkout's default
          # `persist-credentials: true` writes an `AUTHORIZATION: basic <token>`
          # extraheader into `$GITHUB_WORKSPACE/.git/config`, on disk, readable by
          # every process in the job -- including the code Pkg fetches below. Dropping
          # `permissions` to `contents: read` makes that token weak; this makes it
          # absent. Nothing in this job pushes. (#21)
          persist-credentials: false
      # No PormG checkout step. `[sources]` pins it by url + rev, so `julia-buildpkg` below
      # fetches that exact commit itself. This job still EXECUTES that code under `Pkg.test()`,
      # which is why it keeps `contents: read` and `persist-credentials: false` above (#21).
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.version }}
      # Logs the runner's CPU model and LLVM target on every job, passing or failing -- the
      # baseline #301's Windows crash needs. The #254 test prints its own environment only
      # when it fails, because the test runner shows an item's output only then.
      - name: Runner CPU (#301)
        run: julia --startup-file=no -e 'using InteractiveUtils; versioninfo()'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          include-matrix: 'false'
          # Cache eviction is the ONLY thing julia-actions/cache needs `actions: write`
          # for. Restore and save do not. Giving that up here is what lets this job run
          # with no write scope at all while it executes third-party code.
          delete-old-caches: 'false'
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};os=${{ matrix.os }};version=${{ matrix.version }};threads=${{ matrix.threads }}
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      # `coverage` MUST be passed, and gated exactly like the two upload steps below. The
      # action defaults it to `true`, so a bare step runs ALL the jobs under
      # `--code-coverage` while one publishes the result: every leg pays for instrumenting
      # every line, for nothing (#244). Gating only the upload decides who PUBLISHES
      # coverage, not who runs under it. `ci_workflow_tests.jl` asserts the three
      # conditions stay identical. The covering job keeps the per-item timeout: the test
      # runner's watchdog parent kills a hung child, and a child that finishes exits
      # normally, so it writes its `.cov` files (#754; under ReTestItems the two were
      # mutually exclusive, #84).
      #
      # `optimize: '0'` runs the suite at `-O0` (#667). Most of a leg's item time is JIT
      # compilation of code that then runs once, and LLVM's optimization passes are a large
      # share of that compile for no benefit to a test. The action passes `--optimize=0` to its
      # own julia; `Pkg.test`'s child and the test runner's child are both spawned from
      # `Base.julia_cmd()`, which carries `-O0` on, so the items really run at `-O0`.
      #
      # What `-O0` can turn red is a probe that measures `-O2` code rather than Nitro: an
      # allocation count that relies on LLVM eliding a box, or an `@elapsed` bound over a
      # pure-Julia hot loop. If one flips, the answer is to drop this line, not to loosen the
      # probe. Reproduce a CI red locally with `julia -O0`.
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
        with:
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.threads == '1' && matrix.version == '~1.13.0-0' }}
          optimize: '0'
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
        if: matrix.os == 'ubuntu-latest' && matrix.threads == '1' && matrix.version == '~1.13.0-0'
      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        if: matrix.os == 'ubuntu-latest' && matrix.threads == '1' && matrix.version == '~1.13.0-0'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
  smoke:
    # Real coverage for a Julia version whose `test/` suite cannot run.
    #
    # The suite needs every TEST-ONLY dependency to load, so when one does not support a
    # Julia version `Pkg.test()` dies before the first assertion and Nitro has zero
    # verification there — even though `src/` may be perfectly fine. That was the situation
    # on 1.13 until ReTestItems (the runner before #754) caught up; the `test` job covers
    # 1.13 properly now, and this job stands as the standing guard for the next version
    # where it happens again.
    #
    # This job runs a script that depends on nothing test-only: Nitro + HTTP + stdlib,
    # which is the surface a consuming application actually has. It loads the package
    # (exercising the `__init__` `getproperty` redefinition and `queryparams` piracy),
    # registers typed routes, serves over a real socket, and checks shutdown released the
    # listener.
    #
    # BLOCKING, and cheap enough to stay that way even while the matrix's `~1.13.0-0` entry
    # is green: it is the one check that keeps reporting if a test-only dependency ever
    # stops supporting the next Julia.
    name: Smoke test (Julia ${{ matrix.version }})
    runs-on: ubuntu-latest
    # Unlike `test`, this job does not EXECUTE PormG: `smoke_test.jl` loads only Test,
    # Sockets, HTTP and Nitro, PormG is a weakdep so `--project=.` never installs it, and
    # PormG ships no `deps/build.jl`. The tree is read for `[sources]` resolution only.
    # Hardened identically anyway -- the cost is nil, and the day that stops being true
    # should not also be the day the hardening has to be invented.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '~1.13.0-0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # same reason as the `test` job
      # No PormG checkout step, same as the `test` job: `[sources]` pins it by url + rev and
      # `julia-buildpkg` fetches it. This job does not run PormG's code -- the smoke test
      # touches nothing test-only -- but the project still has to resolve.
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          include-matrix: 'false'
          delete-old-caches: 'false'   # same reason as the `test` job above
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};version=${{ matrix.version }}
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - name: Load, route and serve without the test environment
        run: julia --project=. .github/scripts/smoke_test.jl
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # The only job that WRITES anything, and the only one holding the deploy secrets (`test`
    # hands a read-only GITHUB_TOKEN to one coveralls step -- see below). It fetches no PormG,
    # so the third-party code #21 is about never runs here -- which is why the write scope and
    # both secrets are parked in this job rather than at workflow level. Inside the job they
    # are narrower still: both secrets live on the ONE step that deploys (#332).
    #
    # That property is now a FACT ABOUT PKG rather than a structural impossibility, and the
    # difference is worth knowing. Under the old path dep it was fail-closed: a job that
    # somehow pulled PormG's `[sources]` would have died at resolve, because no
    # `../PormG.jl` exists on a runner. Under a url + rev source the same slip would clone
    # PormG -- and potentially build and execute it -- while holding DOCUMENTER_KEY. Two
    # independent things stop that, both checked in Pkg 1.12's `Operations.jl`:
    #
    #   * PormG is a WEAKDEP. `collect_project` resolves `[sources]` (via `get_path_repo`)
    #     only in its `project.deps` loop; the `project.weakdeps` loop builds a bare
    #     `PackageSpec(name, uuid, vspec)` with no path and no repo. So a `Pkg.develop`'d
    #     Nitro never has its PormG source consulted at all.
    #   * `[sources]` crosses a project boundary in exactly ONE place --
    #     `test_project.sources = source_env.project.sources`, where `Pkg.test` copies the
    #     tested package's sources into the env it generates. That is why `test` fetches
    #     PormG and why this job, which never calls `Pkg.test`, structurally cannot.
    #
    # `ci_workflow_tests.jl` cannot guard this: its counter keys off `julia-buildpkg`, which
    # this job does not use. If either Pkg behaviour changes, this is the job to re-read.
    #
    # Two things this comment deliberately does NOT claim:
    #   * `test` is not credential-free -- it hands GITHUB_TOKEN to coveralls as a STEP
    #     input, scoped to that one step, and now carrying only `contents: read`.
    #   * this job is not third-party-code-free -- `docs/Manifest.toml` is gitignored, so
    #     the `Pkg.instantiate()` below resolves Documenter and its whole transitive tree
    #     from the General registry at floating versions and then runs it. Since #332 the
    #     instantiate and doctest steps run it WITHOUT either secret; the deploy step still
    #     runs that same floating tree while holding DOCUMENTER_KEY, because `deploydocs`
    #     is Documenter code. That is the residual supply-chain exposure after #21. It was
    #     never pinned before either, and closing it is a separate decision.
    #
    # `actions: write` is cache eviction, which `test` and `smoke` give up
    # (`delete-old-caches: 'false'`) so they need neither.
    #
    # `contents: write` + `GITHUB_TOKEN` are the FALLBACK deploy path, not the normal one.
    # Documenter picks SSH whenever DOCUMENTER_KEY is non-empty and pushes `gh-pages` with
    # the key, never the token -- so on the happy path neither is load-bearing. They stay
    # because the day the key is empty (rotated, renamed) is the day Documenter falls back
    # to HTTPS, and with no token it would instead print `Deploying: X` and return
    # SUCCESSFULLY: a green job that published nothing (#105). Do not shave them to make
    # the permission table look tidier -- and note an SSH deploy key is not governed by
    # `permissions:` at all, so dropping them would not reduce the deploy surface anyway.
    #
    # Both secrets are STEP-scoped, on the `docs/make.jl` step, not job `env` (#332): only
    # `deploydocs` reads them, and a job-level `env` handed them to every step -- the
    # instantiate and doctest steps included, which run the floating Documenter tree.
    permissions:
      contents: write
      actions: write
    # Serializes docs deploys so a release cut stops racing itself (#124). `deploydocs` pushes to
    # the single `gh-pages` ref, does not force-push, and does not retry. A cut merges its release
    # PR into `main` and then pushes the `vX.Y.Z` tag at that SAME commit, and `on.push` above
    # matches both -- so two runs fire, each with a full `docs` job, and whichever arrives second
    # is rejected non-fast-forward, reddening the release CI for a reason that has nothing to do
    # with the release.
    #
    # The two are NOT redundant, so gating to one trigger is the wrong fix: the `main` run
    # publishes `dev/`, the tag run publishes `vX.Y.Z/` and repoints `stable/`. The tag run is the
    # one that loses -- `gh-pages` holds only `dev/` today, with `DOC_VERSIONS = ["dev"]` and the
    # site root redirecting to `./dev/`. v0.3.0 is the only real instance of the race: v0.1.0 and
    # v0.2.0 were batch-retagged on 2026-08-10, before #105 (df77e2b) pointed `deploydocs` at a
    # repository that exists, so nothing could publish then for an unrelated reason.
    #
    # Serializing is SUFFICIENT because Documenter fetches `gh-pages` at the END of the job, inside
    # `git_push` (`git init` + `git fetch upstream` + `git checkout -b`, in a tempdir) rather than
    # at job start -- so run 2 fetches after run 1's push has landed, and fast-forwards. main-vs-tag
    # also converges in either order: they write different subfolders, and `versions.js` and the
    # `stable` pointer are rebuilt from a `readdir` of whatever version folders exist.
    #
    # `cancel-in-progress: false` because both deploys must land -- cancelling either is the bug,
    # not the fix. `queue: max` raises the pending cap from 1 to 100, FIFO. That is load-bearing,
    # not belt-and-braces: under the default `queue: single` a third push arriving while two were
    # already in the group CANCELS the pending one, which is the tag deploy -- silently losing the
    # exact run this block exists to protect. (`queue: max` requires `cancel-in-progress: false`.)
    #
    # Only deploying events share the group. A `pull_request` docs job returns before touching git
    # (`push_preview = false` in `docs/make.jl` makes `deploydocs` a no-op on a preview build), so
    # it would hold the lock through minutes of doctests and building while never deploying,
    # widening the window in which real deploys contend. `!= 'pull_request'` rather than
    # `== 'push'` on purpose: Documenter also deploys on `workflow_dispatch` and `schedule`, so an
    # allowlist of one event would hand those a private group and reinstate the race if either
    # trigger is added later.
    #
    # Two ordinary `main` pushes in quick succession are serialized by this too, and that is a
    # behavior CHANGE worth knowing: they write the SAME `dev/` folder, so rather than the loser
    # failing loudly, both now succeed and a stale `dev/` can win if the runs reach the gate out of
    # commit order. It self-heals on the next push to `main`.
    concurrency:
      group: docs-deploy-${{ github.event_name != 'pull_request' && 'shared' || github.run_id }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes through the checkout. `deploydocs` clones into its own
          # `mktempdir()` and authenticates with the key, or on the fallback path with a URL it
          # builds from GITHUB_TOKEN in its environment. Persisting the job token into
          # `.git/config` would only hand it to the instantiate and doctest steps below (#332).
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.13'
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};version=1.13
      - run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - run: |
          julia --project=docs -e '
            using Documenter: doctest
            using Nitro
            doctest(Nitro)'
      - name: Build and deploy
        run: julia --project=docs docs/make.jl
        # The only step holding a secret: `deploydocs` in docs/make.jl is the only reader of
        # either. Both must stay present -- see the #105 note above the job's `permissions`.
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docs-lint:
    name: Docs reference lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.13'
      # No package build needed — the script uses only stdlib and reads files.
      - name: Lint agent-context docs for path/link/symbol drift
        run: julia .github/scripts/docs_lint.jl


name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: '*'
# Least privilege by default. Only the `docs` job writes anything, and it neither clones
# nor executes PormG. Every job that DOES execute the pinned sibling checkout runs with
# `contents: read`, `persist-credentials: false`, and no token in its environment.
#
# All three are needed, and none substitutes for the others:
#   * `permissions` decides what a leaked token can DO.
#   * `persist-credentials: false` decides whether it is on DISK for foreign code to read
#     (checkout writes it into `.git/config` by default).
#   * dropping the workflow-level `env` keeps it out of the environment of steps that
#     do not inject their own -- note `julia-actions/julia-buildpkg` DOES inject
#     `GITHUB_TOKEN: ${{ github.token }}` on its own build step, which is precisely why
#     the first two matter more than the third.
# See the `docs` job for where the write scope and the secrets actually live.
permissions:
  contents: read
env:
  # PormG is pinned to an immutable commit rather than tracked at default-branch HEAD,
  # because the `test` job below builds and EXECUTES this code under `Pkg.test()`. An
  # unpinned clone makes a moving third-party input part of every CI run. (`smoke` also
  # fetches it, but only so `[sources]` resolves -- see that job.) Declared once here so
  # the two jobs cannot drift apart.
  #
  # BUMPING THIS: run `PormG.upgrade_guide(from = v"0.5.0")` from PormG's own env first and
  # apply every entry. Pass the LOWER BOUND of the `[compat]` range -- that entry is `^0.5`,
  # which is not itself a version literal. Same rule the `[compat]` pin already carries.
  PORMG_REV: 6d708b4d4b9a1bdefca89fe44c29652574c931c0
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    # This job executes the PormG checkout. It gets no write scope and no token.
    permissions:
      contents: read
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    # Informational versions: these break for reasons that are not ours, and a permanently
    # red required check trains you to stop reading CI. Keep them out of the required set.
    #
    #   nightly      — compiler and Base churn two releases out. Permanently advisory.
    #   ~1.13.0-0    — TEMPORARY. ReTestItems cannot run on 1.13 at all, so this job fails
    #                  before executing a single assertion; nothing in src/ is implicated.
    #                  Real 1.13 coverage comes from the `smoke` job below, which does not
    #                  use ReTestItems and IS blocking. Remove `~1.13.0-0` from this
    #                  condition — putting the full suite back in the required set — as soon
    #                  as a ReTestItems release supports 1.13.
    continue-on-error: ${{ matrix.version == 'nightly' || matrix.version == '~1.13.0-0' }}
    strategy:
      fail-fast: false
      matrix:
        # `1.12` is the floor `[compat]` declares (`julia = "^1.12"`), so it gets the full
        # OS x thread-count grid. The two `include`s below cover the rest of that bound and
        # the future, one job each -- version-specific breakage is not OS-specific, so there
        # is nothing to learn from running them three times.
        version:
          - '1.12'
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        threads: [1, 2]
        include:
          # The next release. `[compat]` promises `julia = "^1.12"`, i.e. 1.13+ as well, and
          # this is the entry that actually tests that claim.
          #
          # It replaces a `version: '1'` (latest stable) entry, which sounded like it covered
          # this but did not: `'1'` resolves to whatever is *released*, and that is still
          # 1.12.7 — so it ran an exact duplicate of the floor jobs above while 1.13, already
          # at rc4, went untested. Latest-stable is only useful here once it stops being the
          # floor, and by then this entry already covers it.
          #
          # `~1.13.0-0` rather than `'1.13'` because plain semver ranges exclude
          # pre-releases; the `-0` lower bound opts them in. It resolves to >=1.13.0-0 and
          # <1.14.0, so it picks up the newest 1.13 pre-release now and keeps covering 1.13.x
          # after release — no bump needed when 1.13.0 ships.
          #
          # MAINTENANCE: when 1.14 enters pre-release, bump this to `~1.14.0-0`. There is no
          # self-maintaining "next release" spec (julia-actions/setup-julia#84 proposes one).
          - version: '~1.13.0-0'
            os: ubuntu-latest
            threads: 2
          # Nitro is unusually exposed to compiler and Base churn: it redefines
          # `Base.getproperty(::HTTP.Request, ::Symbol)` at runtime, pirates
          # `HTTP.queryparams`, reads the `HTTP.BytesBody.data` internal, and treats type
          # inference as an API property -- `test/handler_tests.jl` asserts an exact
          # `Base.infer_return_type`. Nightly is how that surfaces before a stable release,
          # not after.
          - version: 'nightly'
            os: ubuntu-latest
            threads: 2
    steps:
      - uses: actions/checkout@v4
        with:
          # This job EXECUTES the PormG checkout. checkout's default
          # `persist-credentials: true` writes an `AUTHORIZATION: basic <token>`
          # extraheader into `$GITHUB_WORKSPACE/.git/config`, on disk, readable by
          # every process in the job -- including the code fetched below. Dropping
          # `permissions` to `contents: read` makes that token weak; this makes it
          # absent. Nothing in this job pushes. (#21)
          persist-credentials: false
      # PormG is a path dependency (`[sources] PormG = {path = "../PormG.jl"}`)
      # and a hard test dependency, so it must exist alongside this checkout for
      # `Pkg.test()` to resolve. checkout@v4 won't write outside the workspace,
      # so fetch it as a sibling directly, pinned to `PORMG_REV` (top of this file).
      # A `--depth 1` clone can only take a branch tip, so this fetches the one
      # commit by SHA instead -- that is what makes the pin immutable.
      - name: Check out PormG.jl (sibling path dependency, pinned)
        shell: bash
        run: |
          git init -q ../PormG.jl
          git -C ../PormG.jl remote add origin https://github.com/PingoLee/PormG.jl.git
          git -C ../PormG.jl fetch -q --depth 1 origin "$PORMG_REV"
          git -C ../PormG.jl checkout -q --detach FETCH_HEAD
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          include-matrix: 'false'
          # Cache eviction is the ONLY thing julia-actions/cache needs `actions: write`
          # for. Restore and save do not. Giving that up here is what lets this job run
          # with no write scope at all while it executes third-party code.
          delete-old-caches: 'false'
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};os=${{ matrix.os }};version=${{ matrix.version }};threads=${{ matrix.threads }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.threads == '1' && matrix.version == '1.12'
      - uses: coverallsapp/github-action@v2
        if: matrix.os == 'ubuntu-latest' && matrix.threads == '1' && matrix.version == '1.12'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
  smoke:
    # Real coverage for a Julia version whose `test/` suite cannot run.
    #
    # ReTestItems is a TEST-ONLY dependency, so when it does not support a Julia version
    # `Pkg.test()` dies before the first assertion and Nitro has zero verification there —
    # even though `src/` may be perfectly fine. That is the situation on 1.13 today.
    #
    # This job runs a script that depends on nothing test-only: Nitro + HTTP + stdlib,
    # which is the surface a consuming application actually has. It loads the package
    # (exercising the `__init__` `getproperty` redefinition and `queryparams` piracy),
    # registers typed routes, serves over a real socket, and checks shutdown released the
    # listener.
    #
    # Unlike the matrix's `~1.13.0-0` entry, this one is BLOCKING. It is the thing that can
    # actually tell us Nitro is broken on the next release.
    name: Smoke test (Julia ${{ matrix.version }})
    runs-on: ubuntu-latest
    # Unlike `test`, this job does not EXECUTE PormG: `smoke_test.jl` loads only Test,
    # Sockets, HTTP and Nitro, PormG is a weakdep so `--project=.` never installs it, and
    # PormG ships no `deps/build.jl`. The tree is read for `[sources]` resolution only.
    # Hardened identically anyway -- the cost is nil, and the day that stops being true
    # should not also be the day the hardening has to be invented.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '~1.13.0-0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # same reason as the `test` job
      # Same sibling-checkout reason as the `test` job: PormG is a `[sources]` path
      # dependency, so the project cannot resolve without it alongside this checkout.
      # Pinned to the same `PORMG_REV`, for the same reason.
      - name: Check out PormG.jl (sibling path dependency, pinned)
        shell: bash
        run: |
          git init -q ../PormG.jl
          git -C ../PormG.jl remote add origin https://github.com/PingoLee/PormG.jl.git
          git -C ../PormG.jl fetch -q --depth 1 origin "$PORMG_REV"
          git -C ../PormG.jl checkout -q --detach FETCH_HEAD
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          include-matrix: 'false'
          delete-old-caches: 'false'   # same reason as the `test` job above
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};version=${{ matrix.version }}
      - uses: julia-actions/julia-buildpkg@v1
      - name: Load, route and serve without ReTestItems
        run: julia --project=. .github/scripts/smoke_test.jl
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # The only job that WRITES anything, and the only one holding a job-wide secret. It
    # fetches no PormG, so the third-party code #21 is about never runs here -- which is
    # why the write scope and both secrets are parked in this job rather than at workflow
    # level.
    #
    # Two things this comment deliberately does NOT claim:
    #   * `test` is not credential-free -- it hands GITHUB_TOKEN to coveralls as a STEP
    #     input, scoped to that one step, and now carrying only `contents: read`.
    #   * this job is not third-party-code-free -- `docs/Manifest.toml` is gitignored, so
    #     the `Pkg.instantiate()` below resolves Documenter and its whole transitive tree
    #     from the General registry at floating versions and then runs it, while holding
    #     DOCUMENTER_KEY. That is the residual supply-chain exposure after #21. It was
    #     never pinned before either, and closing it is a separate decision.
    #
    # `actions: write` is cache eviction, which `test` and `smoke` give up
    # (`delete-old-caches: 'false'`) so they need neither.
    #
    # `contents: write` + `GITHUB_TOKEN` are the FALLBACK deploy path, not the normal one.
    # Documenter picks SSH whenever DOCUMENTER_KEY is non-empty and pushes `gh-pages` with
    # the key, never the token -- so on the happy path neither is load-bearing. They stay
    # because the day the key is empty (rotated, renamed) is the day Documenter falls back
    # to HTTPS, and with no token it would instead print `Deploying: X` and return
    # SUCCESSFULLY: a green job that published nothing (#105). Do not shave them to make
    # the permission table look tidier -- and note an SSH deploy key is not governed by
    # `permissions:` at all, so dropping them would not reduce the deploy surface anyway.
    #
    # `GITHUB_TOKEN` is job-scoped for the same reason the deploy key is: Documenter reads
    # it from the environment, and no job executing foreign code should have it.
    permissions:
      contents: write
      actions: write
    env:
      DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};version=1.12
      - run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - run: |
          julia --project=docs -e '
            using Documenter: doctest
            using Nitro
            doctest(Nitro)'
      - run: julia --project=docs docs/make.jl
  docs-lint:
    name: Docs reference lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      # No package build needed — the script uses only stdlib and reads files.
      - name: Lint agent-context docs for path/link/symbol drift
        run: julia .github/scripts/docs_lint.jl

